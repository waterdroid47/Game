# Builds the Android app on GitHub's servers (no Android Studio needed).
#
# Every run uploads, under "Artifacts" at the bottom of the run page:
#   - pixel-guard-<version>.aab   -> upload this to Google Play Console
#   - pixel-guard-<version>.apk   -> install this directly on a phone to test
#
# Signing uses the upload key stored in the repository secrets (Settings -> Secrets and
# variables -> Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them only a debug APK is built.
name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Google Play needs a higher version code for every upload.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build the game
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Upload key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No upload key in the repository secrets, so only a debug APK is built."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed AAB + APK
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p ../out
          cp app/build/outputs/bundle/release/app-release.aab "../out/pixel-guard-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/app-release.apk "../out/pixel-guard-$VERSION_NAME.apk"

      - name: Build debug APK
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk "../out/pixel-guard-$VERSION_NAME-debug.apk"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: pixel-guard-${{ env.VERSION_NAME }}
          path: out/
          if-no-files-found: error
