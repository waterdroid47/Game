# TEMPORARY: checks the signed release path with a throwaway key. Nothing is uploaded.
name: Verify release signing (temporary)
on: pull_request
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: 999
      VERSION_NAME: 0.0.0-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci && npm run build && npx cap sync android
      - name: Throwaway key + signed build
        working-directory: android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/t.jks" -storetype PKCS12 -alias tmp -keyalg RSA -keysize 2048 -validity 1 -storepass tmppass123 -keypass tmppass123 -dname "CN=tmp"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/t.jks" ANDROID_KEYSTORE_PASSWORD=tmppass123 ANDROID_KEY_ALIAS=tmp ANDROID_KEY_PASSWORD=tmppass123
          ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Report
        working-directory: android
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          note() { echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | cut -c1-900)"; }
          note sizes "$(ls -la $APK $AAB)"
          note apksigner "$($BT/apksigner verify --print-certs $APK 2>&1 | head -3)"
          note jarsigner-aab "$(jarsigner -verify $AAB 2>&1 | tail -2)"
          note badging "$($BT/aapt2 dump badging $APK 2>&1 | grep -E "^package|sdkVersion|targetSdk|uses-permission|application-label|launchable" )"
          note admob-meta "$($BT/aapt2 dump xmltree --file AndroidManifest.xml $APK 2>&1 | grep -A2 'APPLICATION_ID' | tr -s ' ')"
          note activity "$($BT/aapt2 dump xmltree --file AndroidManifest.xml $APK 2>&1 | grep -E 'screenOrientation|MainActivity' | tr -s ' ')"
          note assets "$(unzip -l $APK | grep -E 'assets/public/(cordova|cordova_plugins)\.js|cordova-plugin-purchase|privacy.html|index.html' | awk '{print $4}')"
          note plugins "$(cat app/src/main/assets/capacitor.plugins.json | tr -d ' \n')"
